<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - หวยลาว</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Lao Lottery - สมาชิก</h1>
            <div class="flex items-center space-x-4">
                <span>ยินดีต้อนรับ, <strong id="usernameDisplay">สมาชิก</strong></span>
                <span class="bg-indigo-700 px-3 py-1 rounded-full text-sm">เครดิต: <span id="creditDisplay">0</span> ₭</span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">ส่งโพยหวยลาว</h2>
            
            <form id="betForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทหวย / เลขที่แทง</label>
                    <input type="text" id="betNumber" placeholder="เช่น 2 ตัวบน 45" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงินเดิมพัน (₭)</label>
                    <input type="number" id="betAmount" placeholder="0" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition">
                    ยืนยันการส่งโพย
                </button>
            </form>
        </div>

        <!-- Order Status Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">สถานะโพยล่าสุด</h2>
            <div id="orderStatus" class="text-gray-500 text-sm">ยังไม่มีรายการส่งโพยในรอบนี้</div>
        </div>
    </main>

    <!-- Script จัดการระบบ -->
    <script>
        const socket = io();

        // ดึงข้อมูลผู้ใช้จาก localStorage (ที่บันทึกตอนล็อกอินสำเร็จ)
        const username = localStorage.getItem('username') || ' member01';
        const credit = localStorage.getItem('credit') || '5000';

        document.getElementById('usernameDisplay').innerText = username;
        document.getElementById('creditDisplay').innerText = Number(credit).toLocaleString();

        // ส่งโพยหวยผ่าน Socket.io
        document.getElementById('betForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const number = document.getElementById('betNumber').value;
            const amount = document.getElementById('betAmount').value;

            const orderData = {
                username: username,
                number: number,
                amount: amount,
                time: new Date().toLocaleTimeString()
            };

            // ส่งข้อมูลไปยัง Server
            socket.emit('submit_bet', orderData);

            // แสดงผลลัพธ์เบื้องต้นหน้าจอ
            document.getElementById('orderStatus').innerHTML = `
                <div class="bg-green-50 border border-green-200 text-green-700 p-3 rounded">
                    ส่งโพยสำเร็จ! เลข: <strong>${number}</strong> จำนวน: <strong>${amount} ₭</strong> (${orderData.time})
                </div>
            `;
            document.getElementById('betForm').reset();
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
