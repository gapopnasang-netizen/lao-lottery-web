<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าสมาชิก - แทงหวยลาวโปร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-gray-800 pb-24">

    <!-- Header สมาชิก -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold">👤 หน้าสมาชิก (Member)</h1>
                <span class="text-xs text-indigo-200">ยูสเซอร์: user_pro01</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-indigo-200 block">เครดิตคงเหลือ</span>
                <span id="userCredit" class="font-semibold text-yellow-300">2,500.00 ฿</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- ฟอร์มสร้างโพย & คำนวณพิเศษ -->
        <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
            <h3 class="font-semibold text-gray-700 border-b pb-2 text-sm">🎯 สร้างโพยหวยลาว</h3>
            
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">โหมดคำนวณอัจฉริยะ</label>
                <select id="calcMode" class="w-full bg-gray-50 border rounded-xl p-2.5 text-sm">
                    <option value="normal">แทงปกติ (ระบุเลขเอง)</option>
                    <option value="3-reverse">3 กลับ (สลับ 6 ชุด)</option>
                    <option value="2-reverse">2 กลับ (สลับ 2 ชุด)</option>
                    <option value="19-door">19 ประตู (รูด 19 หาง)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">ประเภทหวย</label>
                <select id="betType" class="w-full bg-gray-50 border rounded-xl p-2.5 text-sm">
                    <option value="3ตัวบน">3 ตัวบน (จ่าย 900)</option>
                    <option value="3ตัวโต๊ด">3 ตัวโต๊ด (จ่าย 150)</option>
                    <option value="2ตัวบน">2 ตัวบน (จ่าย 95)</option>
                    <option value="2ตัวล่าง">2 ตัวล่าง (จ่าย 95)</option>
                    <option value="วิ่งบน">วิ่งบน (จ่าย 3.2)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">ระบุตัวเลข</label>
                <input type="number" id="inputNumber" placeholder="เช่น 123 หรือ 5" class="w-full bg-gray-50 border rounded-xl p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">จำนวนเงินต่อตัว (บาท)</label>
                <input type="number" id="inputAmount" placeholder="0.00" class="w-full bg-gray-50 border rounded-xl p-2.5 text-sm">
            </div>

            <button onclick="addSpecialBets()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm shadow-md transition">
                ✨ เพิ่มลงในตะกร้าโพย
            </button>
        </div>

        <!-- ตะกร้าโพย (Cart) -->
        <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
            <h3 class="font-semibold text-gray-700 border-b pb-2 text-sm">🛒 ตะกร้าโพยของคุณ</h3>
            <div id="cartContainer" class="space-y-2 max-h-48 overflow-y-auto text-sm">
                <p class="text-center text-gray-400 py-4 text-xs">ยังไม่มีรายการในตะกร้า</p>
            </div>

            <div class="border-t pt-2 space-y-1 text-sm">
                <div class="flex justify-between text-gray-500">
                    <span>ยอดรวมทั้งหมด:</span>
                    <span id="sumTotal">0.00 ฿</span>
                </div>
                <div class="flex justify-between text-indigo-600">
                    <span>ส่วนลดสมาชิก (20%):</span>
                    <span id="sumDiscount">-0.00 ฿</span>
                </div>
                <div class="flex justify-between font-bold text-base pt-1 border-t">
                    <span>ยอดสุทธิที่ต้องจ่าย:</span>
                    <span id="sumNet" class="text-emerald-600">0.00 ฿</span>
                </div>
            </div>

            <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition">
                ✅ ยืนยันการส่งโพย (ยิงตรงสู่เอเย่นต์)
            </button>
        </div>

        <!-- ลิงก์ทางลัดไปหน้าเอเย่นต์ -->
        <div class="text-center pt-2">
            <a href="agent.html" target="_blank" class="text-xs text-indigo-600 underline font-medium">👉 เปิดหน้าแดชบอร์ดเอเย่นต์ (Agent Panel) ในแท็บใหม่</a>
        </div>
    </main>

    <script>
        const socket = io();
        let cart = [];
        const discountRate = 0.20; // ส่วนลด 20%

        // ระบบคำนวณตัวเลขพิเศษ (3 กลับ, 2 กลับ, 19 ประตู)
        function addSpecialBets() {
            const mode = document.getElementById('calcMode').value;
            const type = document.getElementById('betType').value;
            const num = document.getElementById('inputNumber').value.trim();
            const amount = parseFloat(document.getElementById('inputAmount').value);

            if (!num || isNaN(amount) || amount <= 0) {
                alert('กรุณากรอกตัวเลขและจำนวนเงินให้ถูกต้องครับ');
                return;
            }

            let generated = [];
            if (mode === 'normal') {
                generated.push(num);
            } else if (mode === '3-reverse' && num.length === 3) {
                let a = num[0], b = num[1], c = num[2];
                generated = [...new Set([a+b+c, a+c+b, b+a+c, b+c+a, c+a+b, c+b+a])];
            } else if (mode === '2-reverse' && num.length === 2) {
                let a = num[0], b = num[1];
                generated = [a+b]; 
                if (a !== b) generated.push(b+a);
            } else if (mode === '19-door' && num.length === 1) {
                for (let i = 0; i <= 9; i++) {
                    generated.push(num + i);
                    if (i.toString() !== num) generated.push(i + num);
                }
            } else {
                alert('รูปแบบตัวเลขไม่ตรงกับโหมดคำนวณที่เลือกครับ (เช่น 3 กลับต้องใส่เลข 3 หลัก)');
                return;
            }

            generated.forEach(n => cart.push({ type, number: n, amount }));
            alert(`เพิ่มเลขสำเร็จ ${generated.length} ชุด ลงในตะกร้าแล้ว`);
            
            document.getElementById('inputNumber').value = '';
            document.getElementById('inputAmount').value = '';
            renderCart();
        }

        // แสดงผลรายการในตะกร้า
        function renderCart() {
            const container = document.getElementById('cartContainer');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-4 text-xs">ยังไม่มีรายการในตะกร้า</p>';
                document.getElementById('sumTotal').innerText = '0.00 ฿';
                document.getElementById('sumDiscount').innerText = '-0.00 ฿';
                document.getElementById('sumNet').innerText = '0.00 ฿';
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.amount;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl">
                        <div>
                            <span class="text-indigo-600 font-semibold">[${item.type}]</span> 
                            <span class="font-bold ml-1">เลข: ${item.number}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-600">${item.amount} ฿</span>
                            <button onclick="cart.splice(${index},1); renderCart();" class="text-red-500 bg-red-100 px-2 py-0.5 rounded text-xs font-bold">ลบ</button>
                        </div>
                    </div>
                `;
            });

            let discount = total * discountRate;
            let net = total - discount;

            document.getElementById('sumTotal').innerText = total.toLocaleString() + ' ฿';
            document.getElementById('sumDiscount').innerText = '-' + discount.toLocaleString() + ' ฿';
            document.getElementById('sumNet').innerText = net.toLocaleString() + ' ฿';
        }

        // ยืนยันส่งโพยยิงเข้าเซิร์ฟเวอร์
        function checkout() {
            if (cart.length === 0) {
                alert('ไม่มีโพยในตะกร้าครับ');
                return;
            }

            let total = cart.reduce((sum, item) => sum + item.amount, 0);
            let discount = total * discountRate;
            let net = total - discount;

            const newOrder = {
                id: 'POY-' + Math.floor(1000 + Math.random() * 9000),
                user: 'user_pro01',
                items: cart,
                total: total,
                net: net,
                date: new Date().toLocaleTimeString('th-TH')
            };

            // ส่งข้อมูลผ่าน Socket.io ไปยัง Backend เพื่อกระจายให้หน้า Agent ทันที
            socket.emit('submit_bet', newOrder);

            alert('✅ ส่งโพยสำเร็จ! ข้อมูลวิ่งตรงสู่หลังบ้านเอเย่นต์เรียบร้อย');
            cart = [];
            renderCart();
        }
    </script>
</body>
</html>
