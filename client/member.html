<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - หวยลาว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Lao Lottery - สมาชิก</h1>
            <div class="flex items-center space-x-4">
                <span>ยินดีต้อนรับ, <strong id="usernameDisplay">สมาชิก</strong></span>
                <span class="bg-indigo-700 px-3 py-1 rounded-full text-sm">เครดิต: <span id="creditDisplay">5,000</span> ₭</span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-6 space-y-6">
        <!-- แสดงผลรางวัลล่าสุด -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg shadow-md p-6 text-center">
            <h2 class="text-lg font-semibold mb-2">ผลรางวัลหวยลาวงวดล่าสุด</h2>
            <div class="flex justify-center space-x-8 mt-4">
                <div>
                    <p class="text-xs text-purple-200">3 ตัวบน</p>
                    <p id="resThree" class="text-3xl font-bold">---</p>
                </div>
                <div>
                    <p class="text-xs text-purple-200">2 ตัวล่าง</p>
                    <p id="resTwo" class="text-3xl font-bold">--</p>
                </div>
            </div>
        </div>

        <!-- ฟอร์มส่งโพย -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">แทงหวยลาว</h2>
            <form id="betForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เลขที่แทง (เช่น 45)</label>
                    <input type="text" id="betNumber" placeholder="ระบุเลข" required
                        class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (₭)</label>
                    <input type="number" id="betAmount" placeholder="0" required
                        class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition">
                    ส่งโพยหวย
                </button>
            </form>
        </div>

        <!-- ประวัติโพยของฉัน -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">โพยของฉัน</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">เวลา</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">เลข</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">จำนวนเงิน</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="myOrdersBody" class="divide-y divide-gray-200">
                        <tr><td colspan="4" class="px-4 py-3 text-center text-sm text-gray-400">ยังไม่มีประวัติการแทง</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const socket = io();
        const username = localStorage.getItem('username') || 'member01';
        document.getElementById('usernameDisplay').innerText = username;

        socket.on('init_data', (data) => {
            document.getElementById('resThree').innerText = data.result.threeTop;
            document.getElementById('resTwo').innerText = data.result.twoBottom;
            renderMyOrders(data.orders);
        });

        socket.on('update_result_and_orders', (data) => {
            document.getElementById('resThree').innerText = data.result.threeTop;
            document.getElementById('resTwo').innerText = data.result.twoBottom;
            renderMyOrders(data.orders);
        });

        document.getElementById('betForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const order = {
                username: username,
                number: document.getElementById('betNumber').value,
                amount: document.getElementById('betAmount').value,
                time: new Date().toLocaleTimeString()
            };
            socket.emit('submit_bet', order);
            document.getElementById('betForm').reset();
            alert('ส่งโพยสำเร็จ!');
        });

        function renderMyOrders(orders) {
            const myOrders = orders.filter(o => o.username === username);
            const tbody = document.getElementById('myOrdersBody');
            if (myOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-3 text-center text-sm text-gray-400">ยังไม่มีประวัติการแทง</td></tr>`;
                return;
            }
            tbody.innerHTML = myOrders.map(o => `
                <tr>
                    <td class="px-4 py-2 text-sm text-gray-500">${o.time}</td>
                    <td class="px-4 py-2 text-sm font-bold text-indigo-600">${o.number}</td>
                    <td class="px-4 py-2 text-sm text-gray-900">${Number(o.amount).toLocaleString()} ₭</td>
                    <td class="px-4 py-2 text-sm font-semibold ${o.status.includes('ถูก') ? 'text-green-600' : (o.status.includes('ไม่') ? 'text-red-500' : 'text-yellow-600')}">${o.status}</td>
                </tr>
            `).join('');
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
