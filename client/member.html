<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าสมาชิก - ระบบหวยพรีเมียม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header, .box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; font-weight: 700; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #38bdf8; }
        .wallet-card { background: linear-gradient(135deg, #0284c7, #0369a1); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>👤 สมาชิก: สมชาย ใจดี</h2>
            <a href="index.html" style="color: #38bdf8; text-decoration: none;">← กลับหน้าแรก</a>
        </div>

        <!-- กระเป๋าเงิน / เครดิต -->
        <div class="wallet-card">
            <div>
                <p style="margin: 0; font-size: 14px; opacity: 0.9;">เครดิตคงเหลือในกระเป๋า</p>
                <h2 id="userCredit" style="margin: 5px 0 0 0;">1,500.00 ฿</h2>
            </div>
            <button onclick="alert('กรุณาติดต่อเอเยนต์เพื่อเติมเครดิต')" style="width: auto; background: #f8fafc; color: #0f172a; padding: 8px 16px;">💳 เติมเงิน/กระเป๋า</button>
        </div>

        <div class="grid">
            <div class="box">
                <h3>🎟️ ส่งโพยหวย (คำนวณส่วนลด & เลขชุดอัตโนมัติ)</h3>
                <form id="betForm">
                    <label>ประเภท:</label>
                    <select id="betType">
                        <option value="3ตัวบน">3 ตัวบน</option>
                        <option value="2ตัวล่าง">2 ตัวล่าง</option>
                        <option value="3กลับ">3 กลับ (สลับเลข)</option>
                        <option value="19ประตู">19 ประตู</option>
                    </select>
                    <label>เลขที่แทง:</label>
                    <input type="text" id="betNumber" placeholder="เช่น 789 หรือ 45" required>
                    <label>จำนวนเงินต่อตัว (บาท):</label>
                    <input type="number" id="betAmount" placeholder="100" required>
                    
                    <!-- ส่วนสรุปก่อนส่งโพย -->
                    <div style="background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; color: #cbd5e1;">
                        <p style="margin: 2px 0;">ส่วนลดสมาชิก (10%): <span id="prevDiscount">0</span> ฿</p>
                        <p style="margin: 2px 0; font-weight: bold; color: #38bdf8;">ยอดจ่ายสุทธิหลังหักส่วนลด: <span id="prevNet">0</span> ฿</p>
                    </div>

                    <button type="submit">ยืนยันส่งโพย</button>
                </form>
            </div>

            <div class="box">
                <h3>🏆 ผลรางวัลล่าสุด</h3>
                <div style="display: flex; gap: 20px; text-align: center; margin-top: 20px;">
                    <div style="flex: 1; background: #0f172a; padding: 15px; border-radius: 8px;">
                        <p style="color: #94a3b8; margin: 0;">3 ตัวบน</p>
                        <h2 id="resThree" style="color: #38bdf8; margin: 10px 0 0 0;">---</h2>
                    </div>
                    <div style="flex: 1; background: #0f172a; padding: 15px; border-radius: 8px;">
                        <p style="color: #94a3b8; margin: 0;">2 ตัวล่าง</p>
                        <h2 id="resTwo" style="color: #38bdf8; margin: 10px 0 0 0;">---</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="box" style="margin-top: 20px;">
            <h3>📋 สรุปโพยและการได้-เสียของคุณ</h3>
            <table>
                <thead>
                    <tr>
                        <th>ประเภท</th>
                        <th>เลข</th>
                        <th>ยอดแทง</th>
                        <th>หักส่วนลด</th>
                        <th>สุทธิ</th>
                        <th>เวลา</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();

        document.getElementById('betAmount').addEventListener('input', (e) => {
            let amt = parseFloat(e.target.value) || 0;
            let disc = amt * 0.10;
            document.getElementById('prevDiscount').innerText = disc.toFixed(2);
            document.getElementById('prevNet').innerText = (amt - disc).toFixed(2);
        });

        socket.on('init_data', (data) => {
            updateUI(data);
        });

        socket.on('update_orders', (orders) => {
            renderOrders(orders);
        });

        function updateUI(data) {
            document.getElementById('resThree').innerText = data.result.threeTop;
            document.getElementById('resTwo').innerText = data.result.twoBottom;
            renderOrders(data.orders);
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';
            orders.filter(o => o.username === "สมชาย ใจดี").forEach(ord => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${ord.type}</td>
                    <td><b>${ord.number}</b></td>
                    <td>${ord.amount} ฿</td>
                    <td style="color: #f87171;">-${ord.discount || 0} ฿</td>
                    <td style="color: #38bdf8; font-weight: bold;">${ord.netPay} ฿</td>
                    <td>${ord.time}</td>
                    <td style="color: ${ord.status.includes('ถูก') ? '#10b981' : '#f87171'}">${ord.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('betForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const orderData = {
                username: "สมชาย ใจดี",
                type: document.getElementById('betType').value,
                number: document.getElementById('betNumber').value,
                amount: parseFloat(document.getElementById('betAmount').value),
                discountRate: 0.10
            };
            socket.emit('submit_bet', orderData);
            alert('ส่งโพยสำเร็จและบันทึกลงระบบแล้ว!');
        });
    </script>
</body>
</html>
