<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบแทงหวยพรีเมียม - VIP Member Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: #172033; border: 1px solid #28354d; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; margin: 5px 0 15px 0; }
        button { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; }
        .badge-vip { background: #eab308; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #28354d; text-align: left; }
        th { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header / Wallet / AF Link -->
        <div class="card grid-3" style="align-items: center;">
            <div>
                <h3 style="margin: 0;">👤 คุณสมชาย <span class="badge-vip">VIP Gold</span></h3>
                <p style="color: #94a3b8; font-size: 12px; margin: 5px 0;">ลิงก์ชวนเพื่อน: <b style="color: #38bdf8;">https://lottery.com/reg?ref=REF999</b></p>
            </div>
            <div style="background: #0f172a; padding: 15px; border-radius: 8px; text-align: center;">
                <span style="color: #94a3b8; font-size: 12px;">เครดิตคงเหลือ</span>
                <h2 id="creditText" style="margin: 0; color: #10b981;">1,500.00 ฿</h2>
            </div>
            <div>
                <button onclick="depositAuto()" style="background: #10b981;">💳 ฝากเงินออโต้ (สแกน QR)</button>
            </div>
        </div>

        <div class="grid-2">
            <!-- คีย์แทงด่วน & Text Parser -->
            <div class="card">
                <h3>🎟️ แทงหวยด่วน / วางข้อความโพย</h3>
                <label>เลือกประเภทหวย:</label>
                <select id="lotteryTypeSelect">
                    <option value="หวยลาวพรีเมียม">หวยลาวพรีเมียม</option>
                    <option value="ฮานอย VIP">ฮานอย VIP</option>
                    <option value="ยี่กี รอบที่ 1">ยี่กี รอบที่ 1</option>
                </select>

                <label>วางข้อความโพยด่วน (Text-to-Bet):</label>
                <textarea id="textBetInput" rows="3" placeholder="ตัวอย่าง: 123x100x100&#10;45x50"></textarea>

                <div class="grid-2">
                    <div>
                        <label>ประเภท:</label>
                        <select id="betType">
                            <option value="3ตัวบน">3 ตัวบน</option>
                            <option value="2ตัวล่าง">2 ตัวล่าง</option>
                            <option value="19ประตู">19 ประตู</option>
                            <option value="6กลับ">6 กลับ</option>
                        </select>
                    </div>
                    <div>
                        <label>ตัวเลข:</label>
                        <input type="text" id="betNumber" placeholder="789">
                    </div>
                </div>
                <label>จำนวนเงิน (บาท):</label>
                <input type="number" id="betAmount" placeholder="100">

                <button onclick="sendBet()">🚀 ยืนยันส่งโพย</button>
            </div>

            <!-- ผลรางวัล Real-time -->
            <div class="card">
                <h3>🏆 ผลรางวัลล่าสุด (Real-Time)</h3>
                <div id="resultsContainer"></div>
            </div>
        </div>

        <!-- รายการโพยของฉัน -->
        <div class="card">
            <h3>📋 สรุปโพยและการได้-เสียล่าสุด</h3>
            <table>
                <thead>
                    <tr>
                        <th>หวย</th>
                        <th>ประเภท</th>
                        <th>เลข</th>
                        <th>ยอดแทง</th>
                        <th>จ่ายสุทธิ (-12%)</th>
                        <th>สถานะ</th>
                        <th>เงินรางวัล</th>
                    </tr>
                </thead>
                <tbody id="myOrderTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        socket.emit('request_init');

        socket.on('init_data', data => updateAll(data));
        socket.on('results_updated', data => updateAll(data));
        socket.on('orders_updated', orders => renderOrders(orders));

        socket.on('deposit_success', data => {
            alert(`ฝากเงินสำเร็จ! ยอดเข้า +${data.addedCredit} ฿`);
            document.getElementById('creditText').innerText = `${data.newCredit.toFixed(2)} ฿`;
        });

        socket.on('bet_success', data => {
            alert('ส่งโพยเรียบร้อยแล้วครับ!');
            document.getElementById('creditText').innerText = `${data.remainingCredit.toFixed(2)} ฿`;
        });

        socket.on('error_msg', msg => alert(`⚠️ ${msg}`));

        function updateAll(data) {
            // Render Results
            const resBox = document.getElementById('resultsContainer');
            resBox.innerHTML = '';
            for (let [type, res] of Object.entries(data.results)) {
                resBox.innerHTML += `
                    <div style="background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                        <b>${type}</b>: 3 บน -> <span style="color:#38bdf8;">${res.threeTop}</span> | 2 ล่าง -> <span style="color:#38bdf8;">${res.twoBottom}</span>
                    </div>
                `;
            }
            renderOrders(data.orders);
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('myOrderTable');
            tbody.innerHTML = '';
            orders.filter(o => o.username === 'สมชาย').forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td>${o.lotteryType}</td>
                        <td>${o.type}</td>
                        <td><b>${o.number}</b></td>
                        <td>${o.amount} ฿</td>
                        <td style="color:#38bdf8;">${o.netPay} ฿</td>
                        <td style="color:${o.winStatus.includes('ถูก') ? '#10b981' : '#f87171'}">${o.winStatus}</td>
                        <td style="color:#10b981; font-weight:bold;">${o.payout || 0} ฿</td>
                    </tr>
                `;
            });
        }

        function sendBet() {
            const lType = document.getElementById('lotteryTypeSelect').value;
            const bType = document.getElementById('betType').value;
            const bNum = document.getElementById('betNumber').value;
            const bAmt = parseFloat(document.getElementById('betAmount').value) || 0;

            if (!bNum || bAmt <= 0) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            socket.emit('submit_bets', {
                username: 'สมชาย',
                lotteryType: lType,
                bets: [{ type: bType, number: bNum, amount: bAmt }]
            });
        }

        function depositAuto() {
            socket.emit('process_deposit_slip', { username: 'สมชาย', slipData: 'MOCK_QR' });
        }
    </script>
</body>
</html>
