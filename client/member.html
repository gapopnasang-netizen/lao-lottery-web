<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าสมาชิก - ระบบส่งโพยหวย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; padding: 10px; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .receipt { background: #fff; color: #000; padding: 15px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Box -->
        <div id="loginBox" class="card">
            <h3>🔐 เข้าสู่ระบบ</h3>
            <input type="text" id="loginUser" placeholder="ชื่อผู้ใช้งาน">
            <input type="password" id="loginPass" placeholder="รหัสผ่าน">
            <button onclick="doLogin()">เข้าสู่ระบบ</button>
        </div>

        <!-- Main App -->
        <div id="mainApp" style="display:none;">
            <div class="card grid-2">
                <div>
                    <h3 style="margin: 0;">👤 สมาชิก: <span id="userSpan"></span></h3>
                    <small style="color: #38bdf8;">ส่วนลดเมมเบอร์: 10%</small>
                </div>
                <div style="text-align: right;">
                    <span style="font-size: 12px; color: #94a3b8;">เครดิตคงเหลือ</span>
                    <h2 id="creditText" style="margin:0; color:#10b981;">0.00 ฿</h2>
                </div>
            </div>

            <div class="grid-2">
                <div class="card">
                    <h3>🎟️ ส่งโพยหวย (6กลับ, 3กลับ, 19ประตู)</h3>
                    <label>📸 อ่านโพยจากรูปภาพ (OCR):</label>
                    <input type="file" id="slipFile" onchange="ocrScan()">

                    <label>ประเภทชุดเลข:</label>
                    <select id="betType">
                        <option value="6กลับ">6 กลับ</option>
                        <option value="3กลับ">3 กลับ</option>
                        <option value="19ประตู">19 ประตู</option>
                        <option value="3ตัวบน">3 ตัวบน</option>
                        <option value="2ตัวล่าง">2 ตัวล่าง</option>
                    </select>

                    <label>ตัวเลข:</label>
                    <input type="text" id="betNum" placeholder="เช่น 789">
                    <label>จำนวนเงิน (บาท):</label>
                    <input type="number" id="betAmt" placeholder="10">

                    <button onclick="submitBet()">ยืนยันส่งโพย</button>
                </div>

                <div class="card">
                    <h3>📜 สรุปโพยล่าสุด</h3>
                    <div id="receiptBox" class="receipt">
                        <h4 style="text-align:center; margin:0;">ใบสรุปรายการแทง</h4>
                        <hr>
                        <div id="receiptDetail">ยังไม่มีรายการแทง</div>
                        <hr>
                        <div>ยอดรวม: <b id="rGross">0</b> ฿</div>
                        <div style="color:red;">ส่วนลด (10%): -<b id="rDisc">0</b> ฿</div>
                        <div>ยอดชำระสุทธิ: <b id="rNet" style="color:blue;">0</b> ฿</div>
                    </div>
                    <button onclick="downloadReceipt()" style="margin-top:10px; background:#10b981; color:#fff;">💾 บันทึกใบสรุปเป็นรูปภาพ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = "";

        async function doLogin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if(data.token) {
                currentUser = data.username;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('userSpan').innerText = data.username;
                document.getElementById('creditText').innerText = data.credit.toFixed(2) + ' ฿';
            } else {
                alert(data.error);
            }
        }

        function submitBet() {
            socket.emit('submit_order', {
                username: currentUser,
                rawBets: [{
                    type: document.getElementById('betType').value,
                    number: document.getElementById('betNum').value,
                    amount: parseFloat(document.getElementById('betAmt').value) || 0
                }]
            });
        }

        socket.on('order_success', res => {
            alert('ส่งโพยสำเร็จ!');
            document.getElementById('creditText').innerText = res.newCredit.toFixed(2) + ' ฿';
            document.getElementById('rGross').innerText = res.order.totalAmount;
            document.getElementById('rDisc').innerText = res.order.discount;
            document.getElementById('rNet').innerText = res.order.netPay;
            
            let html = '';
            res.order.bets.forEach(b => {
                html += `<div>• ${b.type} [${b.number}] = ${b.amount} ฿ (${b.note})</div>`;
            });
            document.getElementById('receiptDetail').innerHTML = html;
        });

        socket.on('order_error', err => alert('⚠️ ' + err));

        async function ocrScan() {
            const file = document.getElementById('slipFile').files[0];
            if(!file) return;
            const fd = new FormData();
            fd.append('slipImage', file);
            const res = await fetch('/api/ocr-scan', { method: 'POST', body: fd });
            const data = await res.json();
            if(data.success) alert('ข้อความจากสลิป/รูปภาพ:\n' + data.text);
        }

        function downloadReceipt() {
            html2canvas(document.getElementById('receiptBox')).then(c => {
                let a = document.createElement('a');
                a.download = 'receipt.png';
                a.href = c.toDataURL();
                a.click();
            });
        }
    </script>
</body>
</html>
