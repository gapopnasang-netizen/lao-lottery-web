<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบเอเยนต์ - หวยลาวพรีเมียม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: #10b981; color: white; font-weight: 700; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🛠️ Agent Dashboard (ผู้ดูแลระบบ)</h2>
            <a href="index.html" style="color: #34d399; text-decoration: none;">← กลับหน้าแรก</a>
        </div>

        <div class="grid">
            <div class="box">
                <h3>📢 ออกผลรางวัลหวยลาว</h3>
                <form id="resultForm">
                    <label>เลข 3 ตัวบน:</label>
                    <input type="text" id="threeTop" placeholder="789" required>
                    <label>เลข 2 ตัวล่าง:</label>
                    <input type="text" id="twoBottom" placeholder="45" required>
                    <button type="submit">ประกาศผลรางวัล (Real-time)</button>
                </form>
            </div>

            <div class="box">
                <h3>⚙️ ตั้งค่าระบบเอเยนต์</h3>
                <form id="settingForm">
                    <label>อัตราส่วนลด (%):</label>
                    <input type="number" id="discountRate" value="10">
                    <label>วงเงินรับแทงสูงสุด (บาท):</label>
                    <input type="number" id="maxLimit" value="50000">
                    <button type="submit" style="background: #38bdf8; color: #0f172a;">บันทึกการตั้งค่า</button>
                </form>
            </div>
        </div>

        <div class="box" style="margin-top: 20px;">
            <h3>📊 โพยทั้งหมดในระบบ (Real-time Monitor)</h3>
            <table>
                <thead>
                    <tr>
                        <th>สมาชิก</th>
                        <th>ประเภท</th>
                        <th>เลข</th>
                        <th>จำนวนเงิน</th>
                        <th>เวลา</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="agentOrderTable">
                    <!-- โพยทั้งหมด -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('init_data', (data) => {
            document.getElementById('threeTop').value = data.result.threeTop;
            document.getElementById('twoBottom').value = data.result.twoBottom;
            if(data.agentSettings) {
                document.getElementById('discountRate').value = data.agentSettings.discountRate * 100;
                document.getElementById('maxLimit').value = data.agentSettings.maxLimit;
            }
            updateTable(data.orders);
        });

        socket.on('update_result_and_orders', (data) => {
            updateTable(data.orders);
        });

        document.getElementById('resultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const resultData = {
                threeTop: document.getElementById('threeTop').value,
                twoBottom: document.getElementById('twoBottom').value
            };
            socket.emit('publish_result', resultData);
            alert('ประกาศผลรางวัลสำเร็จ!');
        });

        document.getElementById('settingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newSettings = {
                discountRate: parseFloat(document.getElementById('discountRate').value) / 100,
                maxLimit: parseFloat(document.getElementById('maxLimit').value)
            };
            socket.emit('update_settings', newSettings);
            alert('บันทึกการตั้งค่าเอเยนต์สำเร็จ!');
        });

        function updateTable(orders) {
            const tbody = document.getElementById('agentOrderTable');
            tbody.innerHTML = '';
            orders.forEach(ord => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${ord.username}</td><td>${ord.type}</td><td><b>${ord.number}</b></td><td>${ord.amount || ord.netPay || 0} ฿</td><td>${ord.time || 'ล่าสุด'}</td><td style="color: ${ord.status.includes('ถูก') ? '#10b981' : '#f87171'}">${ord.status}</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
