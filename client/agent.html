<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบบริหารจัดการเอเยนต์ & เจ้ามือ - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #10b981; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ แดชบอร์ดเอเยนต์ & ควบคุมความเสี่ยงเจ้ามือ</h2>

        <div class="grid-2">
            <!-- ประกาศผลรางวัล Multi-Lottery -->
            <div class="card">
                <h3>📢 ประกาศผลรางวัลประจำรอบ</h3>
                <label>เลือกประเภทหวย:</label>
                <select id="agentLotterySelect">
                    <option value="หวยลาวพรีเมียม">หวยลาวพรีเมียม</option>
                    <option value="ฮานอย VIP">ฮานอย VIP</option>
                    <option value="ยี่กี รอบที่ 1">ยี่กี รอบที่ 1</option>
                </select>
                <label>3 ตัวบน:</label>
                <input type="text" id="topRes" placeholder="789">
                <label>2 ตัวล่าง:</label>
                <input type="text" id="botRes" placeholder="45">
                <button onclick="publishResult()">ออกผลรางวัลและตรวจโพยทันที</button>
            </div>

            <!-- ระบบจัดการอั้น & วงเงินคุมเสี่ยง -->
            <div class="card">
                <h3>🛡️ จำกัดวงเงินเสี่ยงสูงสุด (Max Risk Limit)</h3>
                <p style="font-size: 13px; color: #94a3b8;">ระบบจะปรับเลขนั้นเป็น "เลขอั้นออโต้" ทันทีเมื่อมียอดแทงรวมเกินวงเงินที่กำหนดไว้</p>
                <label>วงเงินอั้นต่อตัวเลข (บาท):</label>
                <input type="number" id="limitPerNum" value="10000">
                <button style="background: #eab308; color: #000;" onclick="alert('บันทึกวงเงินสุ่มเสี่ยงเรียบร้อย')">อัปเดตลิมิตเสี่ยง</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        function publishResult() {
            const lType = document.getElementById('agentLotterySelect').value;
            const top = document.getElementById('topRes').value;
            const bot = document.getElementById('botRes').value;

            if (!top || !bot) return alert('กรุณาระบุเลขรางวัล');

            socket.emit('publish_lottery_result', {
                lotteryType: lType,
                threeTop: top,
                twoBottom: bot
            });
            alert(`ประกาศผล ${lType} สำเร็จ! ระบบกำลังคำนวณเงินรางวัลให้สมาชิก`);
        }
    </script>
</body>
</html>
