<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - หวยลาว</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-purple-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Lao Lottery - แดชบอร์ดตัวแทน (Agent)</h1>
            <div class="flex items-center space-x-4">
                <span>ผู้ดูแล: <strong id="agentUsername">Agent</strong></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-4 mt-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-semibold text-gray-800">โพยหวยที่ส่งเข้ามาแบบเรียลไทม์</h2>
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded">ระบบเชื่อมต่อแล้ว (Live)</span>
            </div>

            <!-- ตารางแสดงโพย -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เวลา</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สมาชิก</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เลขที่แทง</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">จำนวนเงิน (₭)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">ยังไม่มีโพยหวยเข้ามาในขณะนี้...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script จัดการ Real-time Socket.io -->
    <script>
        const socket = io();

        // แสดงชื่อ Agent จาก localStorage
        const username = localStorage.getItem('username') || 'agent_boss';
        document.getElementById('agentUsername').innerText = username;

        // ดักฟังข้อมูลโพยใหม่ที่ส่งมาจากสมาชิกผ่าน Server
        socket.on('broadcast_new_order', (order) => {
            const tbody = document.getElementById('ordersTableBody');
            
            // ลบข้อความ "ยังไม่มีโพย" ออกในครั้งแรกที่มีข้อมูลเข้า
            if (tbody.innerHTML.includes('ยังไม่มีโพยหวยเข้ามา')) {
                tbody.innerHTML = '';
            }

            // สร้างแถวใหม่ในตาราง
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50 transition';
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.time}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${order.username}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-indigo-600 font-bold">${order.number}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${Number(order.amount).toLocaleString()}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">รอผลรางวัล</span>
                </td>
            `;

            // แทรกข้อมูลใหม่ไว้ด้านบนสุด
            tbody.prepend(row);
        });

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
