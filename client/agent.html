<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - หวยลาว</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <nav class="bg-purple-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Lao Lottery - แดชบอร์ดเอเยนต์</h1>
            <div class="flex items-center space-x-4">
                <span>ผู้ดูแล: <strong id="agentUsername">Agent</strong></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-6 space-y-6">
        <!-- ควบคุมการออกรางวัล -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">ออกผลรางวัลหวยลาว</h2>
            <form id="resultForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">3 ตัวบน</label>
                    <input type="text" id="threeTopInput" placeholder="เช่น 123" maxlength="3" required
                        class="w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">2 ตัวล่าง</label>
                    <input type="text" id="twoBottomInput" placeholder="เช่น 45" maxlength="2" required
                        class="w-full px-3 py-2 border rounded-md">
                </div>
                <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-md transition">
                    ประกาศผลรางวัล & ตรวจโพยออโต้
                </button>
            </form>
        </div>

        <!-- รายการโพยทั้งหมดแบบเรียลไทม์ -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">โพยทั้งหมดจากสมาชิก</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">เวลา</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">สมาชิก</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">เลขที่แทง</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">จำนวนเงิน (₭)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="allOrdersTableBody" class="bg-white divide-y divide-gray-200">
                        <tr><td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">ยังไม่มีโพยหวยเข้ามา...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const socket = io();
        document.getElementById('agentUsername').innerText = localStorage.getItem('username') || 'agent_boss';

        socket.on('init_data', (data) => {
            renderOrders(data.orders);
        });

        socket.on('update_result_and_orders', (data) => {
            renderOrders(data.orders);
            alert('ประกาศผลรางวัลเรียบร้อย ระบบตรวจโพยอัตโนมัติแล้ว!');
        });

        socket.on('broadcast_new_order', (order) => {
            // เมื่อมีโพยใหม่เข้ามาเติมในตารางสดๆ
            socket.emit('request_refresh'); // หรือปล่อยให้ render ใหม่
        });

        document.getElementById('resultForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const resultData = {
                threeTop: document.getElementById('threeTopInput').value,
                twoBottom: document.getElementById('twoBottomInput').value
            };
            socket.emit('publish_result', resultData);
        });

        function renderOrders(orders) {
            const tbody = document.getElementById('allOrdersTableBody');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">ยังไม่มีโพยหวยเข้ามา...</td></tr>`;
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${o.time}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${o.username}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-indigo-600">${o.number}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${Number(o.amount).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold ${o.status.includes('ถูก') ? 'text-green-600' : (o.status.includes('ไม่') ? 'text-red-500' : 'text-yellow-600')}">${o.status}</td>
                </tr>
            `).join('');
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
