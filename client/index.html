<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Lao Lottery Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-8 space-y-6">
        
        <!-- หัวข้อหลัก -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-amber-400 tracking-wide">LAO LOTTERY</h1>
            <p class="text-slate-400 text-sm">ระบบบริหารจัดการและส่งโพยหวยออนไลน์</p>
        </div>

        <!-- ปุ่มเลือกประเภทผู้ใช้งาน (Member / Agent) -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700" id="roleToggle">
            <button type="button" onclick="switchRole('member')" id="btnMember" 
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-amber-500 text-slate-950 shadow-md">
                👤 เข้าสู่ระบบสมาชิก
            </button>
            <button type="button" onclick="switchRole('agent')" id="btnAgent" 
                class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white">
                💼 เข้าสู่ระบบเอเยนต์
            </button>
        </div>

        <!-- ฟอร์มล็อกอิน -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <input type="hidden" id="loginRole" value="member">

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1.5" id="labelUsername">ชื่อผู้ใช้สมาชิก</label>
                <input type="text" id="username" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                    placeholder="กรอกชื่อผู้ใช้ของคุณ">
            </div>

            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1.5">รหัสผ่าน</label>
                <input type="password" id="password" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                    placeholder="••••••••">
            </div>

            <!-- ข้อความแจ้งเตือน Error -->
            <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl p-3 text-center"></div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition-all duration-200 transform active:scale-98">
                เข้าสู่ระบบสมาชิก
            </button>
        </form>

        <div class="text-center border-t border-slate-700/60 pt-4">
            <p class="text-xs text-slate-500">© 2026 Lao Lottery Enterprise System. All rights reserved.</p>
        </div>

    </div>

    <script>
        let currentRole = 'member';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('loginRole').value = role;

            const btnMember = document.getElementById('btnMember');
            const btnAgent = document.getElementById('btnAgent');
            const labelUsername = document.getElementById('labelUsername');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');

            if (role === 'member') {
                btnMember.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-amber-500 text-slate-950 shadow-md";
                btnAgent.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white";
                labelUsername.innerText = "ชื่อผู้ใช้สมาชิก";
                submitBtn.innerText = "เข้าสู่ระบบสมาชิก";
                submitBtn.className = "w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition-all duration-200";
            } else {
                btnAgent.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-md";
                btnMember.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white";
                labelUsername.innerText = "ชื่อผู้ใช้เอเยนต์ / แอดมิน";
                submitBtn.innerText = "เข้าสู่ระบบเอเยนต์";
                submitBtn.className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all duration-200";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังตรวจสอบ...";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: currentRole })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }

                // บันทึก Token และ ข้อมูลผู้ใช้
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // นำทางไปยังหน้าของแต่ละ Role
                if (data.user.role === 'agent' || currentRole === 'agent') {
                    window.location.href = '/agent.html';
                } else {
                    window.location.href = '/member.html';
                }

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = currentRole === 'member' ? "เข้าสู่ระบบสมาชิก" : "เข้าสู่ระบบเอเยนต์";
            }
        }

        // เช็คว่าเคยล็อกอินไว้แล้วหรือไม่
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (token && user.role) {
                if (user.role === 'agent') window.location.href = '/agent.html';
                else window.location.href = '/member.html';
            }
        });
    </script>
</body>
</html>
